
name: Bookden CI/CD

on:
  push:
    branches:
      - development
      - production
      - automated-deployment # remove later
  pull_request:
    branches: [development, production]



jobs:

  lint_and_test:
    name: lint and test (server and client)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookden_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d bookden_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root deps (for Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
          
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        env:
          DB_ADMIN: ${{ secrets.DB_ADMIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          TEST_DB_URL: postgresql://${{ secrets.DB_ADMIN }}:${{ secrets.DB_PASSWORD }}@localhost:5432/bookden_test
          PORT: 3000
          FIRST_SUPERADMIN_USERNAME: ${{ secrets.FIRST_SUPERADMIN_USERNAME }}
          FIRST_SUPERADMIN_PASSWORD: ${{ secrets.FIRST_SUPERADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test
        run: npm run test:bail

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Test client
        working-directory: client
        run: npm run test

      
      - name: Generate env files for docker compose
        run: |
          mkdir -p env/dev
          
          echo "POSTGRES_DB=bookden_test" > env/dev/postgres.env
          echo "POSTGRES_USER=${{ secrets.DB_ADMIN }}" >> env/dev/postgres.env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env/dev/postgres.env

          echo "DB_ADMIN=${{ secrets.DB_ADMIN }}" > env/dev/server.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env/dev/server.env
          echo "DB_HOST=local-postgres-database" >> env/dev/server.env
          echo "DB_PORT=5432" >> env/dev/server.env
          echo "TEST_DB_URL=postgresql://${{ secrets.DB_ADMIN }}:${{ secrets.DB_PASSWORD }}@local-postgres-database:5432/bookden_test" >> env/dev/server.env
          echo "PORT=3000" >> env/dev/server.env
          echo "FIRST_SUPERADMIN_USERNAME=${{ secrets.FIRST_SUPERADMIN_USERNAME }}" >> env/dev/server.env
          echo "FIRST_SUPERADMIN_PASSWORD=${{ secrets.FIRST_SUPERADMIN_PASSWORD }}" >> env/dev/server.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> env/dev/server.env
          echo "NODE_ENV=development" >> env/dev/server.env

          echo "VITE_API_BASE=http://localhost:3000/api" > env/dev/client.env
          echo "VITE_BASE_PATH=/" >> env/dev/client.env


      - name: Start App (docker compose)
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for server health
        run: |
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health >/dev/null; then
              echo "Backend ready!"
              exit 0
            fi
            echo "Retry..."
            sleep 2
          done
          echo "Backend never became ready"
          exit 1

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Stop App
        if: always()
        run: docker compose -f docker-compose.dev.yml down
        
