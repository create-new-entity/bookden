
name: Bookden CI/CD

on:
  push:
    branches:
      - development
      - production
      - automated-deployment # remove later
  pull_request:
    branches: [development, production]



jobs:

  lint_and_test:
    name: lint and test (server and client)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookden_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d bookden_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        env:
          DB_ADMIN: admin
          DB_PASSWORD: password
          DB_HOST: localhost
          TEST_DB_URL: postgresql://admin:password@localhost:5432/bookden_test
          PORT: 3000
          FIRST_SUPERADMIN_USERNAME: superadmin
          FIRST_SUPERADMIN_PASSWORD: password
          JWT_SECRET: secret
          NODE_ENV: test
        run: npm run test:bail

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Test client
        working-directory: client
        run: npm run test
        
