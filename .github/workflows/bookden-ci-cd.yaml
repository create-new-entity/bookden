
name: Bookden CI/CD

on:
  push:
    branches:
      - production
  pull_request:
    branches: [development, production]


jobs:

  lint-and-unit-tests:
    name: lint and test (server and client)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root deps
        run: npm ci

      - name: Generate env files for test docker compose
        run: |
          mkdir -p env/test
          
          echo "POSTGRES_DB=bookden_test" > env/test/postgres.env
          echo "POSTGRES_USER=${{ secrets.DB_ADMIN }}" >> env/test/postgres.env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env/test/postgres.env

          echo "DB_NAME=bookden_test" > env/test/server.env
          echo "DB_ADMIN=${{ secrets.DB_ADMIN }}" >> env/test/server.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env/test/server.env
          echo "DB_HOST=bookden-test-postgres" >> env/test/server.env
          echo "DB_PORT=5432" >> env/test/server.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> env/test/server.env
          echo "NODE_ENV=test" >> env/test/server.env

          echo "VITE_API_BASE=http://localhost:3000/api" > env/test/client.env
          echo "VITE_BASE_PATH=/" >> env/test/client.env

      - name: Lint & Unit Tests (Docker jobs)
        run: npm run ci

  e2e-tests:
    name: E2E - Playwright
    runs-on: ubuntu-24.04
    needs: lint-and-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate env files for dev docker compose
        run: |
          mkdir -p env/dev

          echo "POSTGRES_DB=bookden_dev" > env/dev/postgres.env
          echo "POSTGRES_USER=${{ secrets.DB_ADMIN }}" >> env/dev/postgres.env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env/dev/postgres.env

          echo "DB_NAME=bookden_dev" > env/dev/server.env
          echo "DB_ADMIN=${{ secrets.DB_ADMIN }}" >> env/dev/server.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env/dev/server.env
          echo "DB_HOST=local-postgres-database" >> env/dev/server.env
          echo "DB_PORT=5432" >> env/dev/server.env
          echo "PORT=3000" >> env/dev/server.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> env/dev/server.env
          echo "NODE_ENV=development" >> env/dev/server.env

          echo "VITE_API_BASE=http://localhost:3000/api" > env/dev/client.env
          echo "VITE_BASE_PATH=/" >> env/dev/client.env

      - name: Start app (dev stack)
        run: docker compose -f docker-compose.dev.yml up -d --build --remove-orphans

      - name: Wait for backend health
        run: |
          echo "Waiting for backend..."
          for i in {1..10}; do
            if curl -s http://localhost:3000/api/health >/dev/null; then
              echo "Backend ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became ready"
          exit 1

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml logs server
          docker compose -f docker-compose.dev.yml logs local-postgres-database

      - name: Stop app
        if: always()
        run: docker compose -f docker-compose.dev.yml down 

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: lint_and_test
    if: github.ref == 'refs/heads/production' # Deploy to production if the branch is production.

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for tagging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PERSONAL_ACCESS_TOKEN }}


      - name: Build & Push SERVER image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server.prod
          push: true
          tags: |
            imranpavel/bookden-server:latest

        
      - name: Build & Push CLIENT image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client.prod
          push: true
          tags: |
            imranpavel/bookden-client:latest
          build-args: |
            VITE_API_BASE=${{ secrets.PROD_VITE_API_BASE }}
            VITE_BASE_PATH=${{ secrets.PROD_VITE_BASE_PATH }}


      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}

          # set -e -> If ANY command fails (exit code ≠ 0), stop the script immediately.
          script: |
            set -e

            cd /root/bookden

            echo "Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down

            echo "Remove Bookden Postgres data volume (fresh DB). After all it is just a portfolio project."
            docker volume rm bookden-prod_postgres_data || true

            echo "Starting new containers with fresh DB..."
            docker compose -f docker-compose.prod.yml up -d --pull always --force-recreate      

            echo "Running SAFE cleanup..."
            docker container prune -f
            docker image prune -f
            docker network prune -f
            docker builder prune -f

            echo "Deployment complete!"