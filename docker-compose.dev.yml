
name: bookden-dev

services:
  local-postgres-database:
    container_name: local-postgres-database
    image: postgres:16-alpine
    env_file:
      - ./env/dev/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    container_name: bookden-dev-server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    depends_on:
      local-postgres-database:
        condition: service_healthy   # Just waiting for the database to start is not enough. We need to wait until it is ready to accept connections.
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./env/dev/server.env

  client:
    container_name: bookden-dev-client
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    depends_on:
      - server
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./env/dev/client.env

volumes:
  pgdata:
